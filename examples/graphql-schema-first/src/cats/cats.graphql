type Owner {
  id: Int!
  name: String!
}

type Cat {
  id: Int!
  name: String!
  age: Int!
  owner: Owner
}

input CreateCatInput {
  name: String!
  age: Int!
  ownerId: Int
}

type Query {
  cats: [Cat!]!
  cat(id: Int!): Cat
}

type Mutation {
  createCat(createCatInput: CreateCatInput!): Cat!
}
