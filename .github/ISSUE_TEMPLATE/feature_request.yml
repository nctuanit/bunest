name: Feature Request
description: Propose a new feature, NestJS parity item, or DX improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or Behavior
      description: Sketch how you imagine using this feature in Bunest.
      render: ts

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative designs you considered?

  - type: checkboxes
    id: contribute
    attributes:
      label: Willingness to Contribute
      options:
        - label: I would be willing to submit a PR for this feature
